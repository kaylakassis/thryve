name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivy_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ivy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches tests/bootstrap.mjs defaults. The suites apply SCHEMA_SQL
      # themselves via ensureSchemaApplied() against this fresh DB.
      DATABASE_URL: postgres://ivy_test:test@localhost:5432/ivy_test
      JWT_SECRET: test_secret_for_ci_only_at_least_32_chars_long
      RESEND_API_KEY: __test__
      EMAIL_FROM: Ivy <test@example.com>

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (full suite)
        run: npm test

  # ── Gated production deploy ─────────────────────────────────────────
  # Vercel's git auto-deploy for main is DISABLED (vercel.json →
  # git.deploymentEnabled.main: false), so this job is the only path to
  # production: it runs strictly after lint + build + the full test
  # suite pass. A commit that fails CI never reaches joinivy.ai.
  #
  # Requires three repo secrets (Settings → Secrets and variables →
  # Actions): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Measured: this project's remote Vercel build (migrate + vite +
    # ~150 serverless functions) runs 12-15 min. 30 gives headroom while
    # still killing a genuine hang long before GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Production deploys are paused: add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as GitHub Actions secrets to enable CI-gated deploys. Production stays on the last deployed commit until then."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Remote build on Vercel's infra with the project's own env vars -
        # identical to what a git push used to trigger, just gated.
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
